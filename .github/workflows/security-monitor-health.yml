name: MyTerm security monitor health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,14 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: myterm-security-monitor-health
  cancel-in-progress: false

jobs:
  health:
    name: Verify recent monitor evidence independently of tool regressions
    if: github.repository == 'crazy01100/myterm' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stdlib-only metadata check. No pip/npm setup, vulnerability regressions,
      # source-policy network check, cloud credentials or service invocation.
      - name: Prepare pinned GitHub CLI without installing project packages
        run: ./scripts/project-python.sh -I -B scripts/project-gh-runtime.py setup
      - name: Check monitor schedule and retained report
        id: health
        run: ./scripts/project-python.sh -B scripts/security-monitor-health.py --output build/security-monitor-health.json
      - name: Publish health changes
        if: always() && steps.health.outcome != 'skipped'
        run: ./scripts/project-python.sh -B scripts/sync-security-health.py --report build/security-monitor-health.json --apply
      - name: Save health evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-monitor-health
          path: |
            build/security-monitor-health.json
            build/security-health-notification.json
          retention-days: 30
          if-no-files-found: error
