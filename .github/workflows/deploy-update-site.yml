name: Deploy MyTerm update site

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published MyTerm release tag to redeploy
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: myterm-update-site-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy signed release to Cloudflare Pages
    if: github.repository == 'crazy01100/myterm' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MYTERM_CI_OPENSSL: required
      MYTERM_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out public site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select supported Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Select supported Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: Prepare verified OpenSSL for project Python
        run: '"$pythonLocation/bin/python3" -I -S -B scripts/project-openssl-runtime.py setup'

      - name: Prepare trusted Python tooling before network policy checks
        run: |
          mkdir -p build
          printf '%s\n' '{"stage":"python-bootstrap","status":"started"}' > build/python-tooling-preflight.json
          ./scripts/setup-security-tools.sh
          ./scripts/project-python.sh -I -B scripts/project-gh-runtime.py setup
          ./scripts/project-python.sh -B scripts/node-toolchain.py setup
          ./scripts/project-python.sh -B scripts/project-java-runtime.py setup
          ./scripts/project-python.sh -B scripts/security-prepare-inventory.py
          ./scripts/project-python.sh -B scripts/python-toolchain.py inventory > build/python-tooling-inventory.json

      - name: Verify approved security sources before redeployment
        run: |
          ./scripts/project-node.sh --npm ci --ignore-scripts --no-fund --no-audit
          ./scripts/project-python.sh scripts/security-source-review.py --purpose redeploy --task "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Prepare and verify the isolated deployment dependency graph
        run: |
          ./scripts/project-node.sh --npm ci --prefix Tools/Deployment --ignore-scripts --no-fund --no-audit --userconfig=/dev/null --registry=https://registry.npmjs.org
          ./scripts/project-python.sh -B scripts/security-toolchain-inventory.py --purpose deployment --output build/deployment-toolchain-inventory.json

      - name: Enforce current toolchain security before deployment credentials
        run: ./scripts/project-python.sh scripts/security-audit.py --output build/deployment-security-report.json

      - name: Download signed release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          ./scripts/project-gh.sh release download "$MYTERM_RELEASE_TAG" \
            --dir build/release-assets \
            --pattern 'MyTerm-*-arm64.zip' \
            --pattern 'appcast.xml' \
            --pattern 'release-notes.html' \
            --pattern 'CHECKSUMS.txt' \
            --pattern 'release-manifest.json'

      - name: Verify signatures before extraction
        run: |
          ./scripts/security-python.sh scripts/verify-signed-release.py \
            --assets build/release-assets \
            --public-key-file Config/Release/SparklePublicKey.txt \
            --base-url https://mtus.lieniapp.work \
            --version "${MYTERM_RELEASE_TAG#v}" \
            --commit "$(git rev-list -n 1 "$MYTERM_RELEASE_TAG")"

      - name: Verify packaged App resources
        shell: bash
        run: |
          set -euo pipefail
          archives=(build/release-assets/MyTerm-*-arm64.zip)
          [[ ${#archives[@]} -eq 1 ]]
          ./scripts/verify-packaged-resources.sh --archive "${archives[0]}"

      - name: Prepare and verify static deployment
        shell: bash
        run: |
          set -euo pipefail
          version="${MYTERM_RELEASE_TAG#v}"
          ./scripts/prepare-pages-deployment.sh \
            --assets build/release-assets \
            --version "$version" \
            --output build/pages
          ./scripts/verify-pages-site.sh build/pages

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: ./scripts/project-node.sh Tools/Deployment/node_modules/wrangler/bin/wrangler.js pages deploy build/pages --project-name=myterm-updates --branch=main

      - name: Verify public update site from external runner
        shell: bash
        run: |
          set -euo pipefail
          version="${MYTERM_RELEASE_TAG#v}"
          ./scripts/verify-public-update-site.sh \
            --assets build/release-assets \
            --version "$version"

      - name: Save Python tooling diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tooling-deployment-evidence
          path: |
            build/python-tooling-preflight.json
            build/python-tooling-inventory.json
            build/deployment-toolchain-inventory.json
            build/deployment-security-report.json
          retention-days: 14
          if-no-files-found: warn
