name: MyTerm security monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: myterm-security-monitor
  cancel-in-progress: false
jobs:
  monitor:
    name: Risk monitoring (failure means an operational error)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: ./scripts/setup-security-tools.sh
      - name: Verify release validation and audit policies
        run: ./scripts/security-python.sh -m unittest discover -s Tests/Security -v
      - name: Restore previous monitor state
        run: python3 scripts/restore-security-monitor.py build/previous-security-report.json
      - name: Scan source and released App
        run: |
          python3 scripts/security-audit.py --monitor \
            --include-release "$GITHUB_REPOSITORY" \
            --previous build/previous-security-report.json \
            --output build/security-report.json
      - name: Record risks in private Issues
        run: python3 scripts/sync-security-issues.py --report build/security-report.json --apply
      - name: Save monitor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-monitor-state
          path: |
            build/security-report.json
            build/security-issues-result.json
          retention-days: 30
          if-no-files-found: error
