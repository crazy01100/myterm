name: MyTerm security monitor
on:
  workflow_dispatch:
    inputs:
      refresh_issue_format:
        description: Refresh existing bot Issue formatting while preserving history
        type: boolean
        default: false
  schedule:
    - cron: '23 1,13 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: myterm-security-monitor
  cancel-in-progress: false
jobs:
  monitor:
    name: Risk monitoring (failure means an operational error)
    if: github.repository == 'crazy01100/myterm' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    # Advisory monitoring only. Full fixed regressions remain in PR/push CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        id: tools
        run: |
          mkdir -p build
          printf '%s\n' '{"stage":"python-bootstrap","status":"started"}' > build/python-tooling-preflight.json
          ./scripts/setup-security-tools.sh
          ./scripts/project-python.sh -I -B scripts/project-gh-runtime.py setup
          ./scripts/project-python.sh -B scripts/node-toolchain.py setup
          ./scripts/project-python.sh -B scripts/project-java-runtime.py setup
          ./scripts/project-python.sh -B scripts/security-prepare-inventory.py
          ./scripts/project-python.sh -B scripts/python-toolchain.py inventory > build/python-tooling-inventory.json
      - name: Verify pinned Firebase development tools
        id: dependencies
        run: |
          mkdir -p build
          ./scripts/project-python.sh -c 'import json; print(json.dumps({"stage": "development-tool-preflight", "status": "started"}))' > build/security-preflight.json
          ./scripts/project-node.sh --npm ci --ignore-scripts --no-fund --no-audit
          ./scripts/project-node.sh --npm ci --prefix Tools/Deployment --ignore-scripts --no-fund --no-audit --userconfig=/dev/null --registry=https://registry.npmjs.org
          ./scripts/project-python.sh scripts/security-source-review.py --purpose monitor --task "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output build/security-source-review.json
          ./scripts/project-node.sh scripts/verify-firebase-tools.cjs
      - name: Restore previous monitor state
        if: always() && steps.dependencies.outcome == 'success'
        run: ./scripts/project-python.sh scripts/restore-security-monitor.py build/previous-security-report.json
      - name: Scan source and released App
        id: scan
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          ./scripts/project-python.sh scripts/security-audit.py --monitor \
            --include-release "$GITHUB_REPOSITORY" \
            --previous build/previous-security-report.json \
            --output build/security-report.json
      - name: Record published advisory risks in Issues
        id: risk_issues
        if: always() && steps.dependencies.outcome == 'success' && steps.scan.outcome != 'skipped'
        env:
          REFRESH_ISSUE_FORMAT: ${{ inputs.refresh_issue_format }}
        run: |
          args=()
          if [[ "$REFRESH_ISSUE_FORMAT" == "true" ]]; then args+=(--refresh-format); fi
          ./scripts/project-python.sh scripts/sync-security-issues.py --report build/security-report.json --allow-public --apply "${args[@]}"
      - name: Record coverage and official notice review
        id: notice_issues
        if: always() && steps.dependencies.outcome == 'success' && steps.scan.outcome != 'skipped'
        run: ./scripts/project-python.sh scripts/sync-security-monitor-status.py --report build/security-report.json --apply
      - name: Bind scan and notification receipt
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RISK_ISSUES_OUTCOME: ${{ steps.risk_issues.outcome }}
          NOTICE_ISSUES_OUTCOME: ${{ steps.notice_issues.outcome }}
        run: ./scripts/project-python.sh scripts/security-monitor-receipt.py --report build/security-report.json
      - name: Save monitor evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-monitor-state
          path: |
            build/security-report.json
            build/security-issues-result.json
            build/security-monitor-status-result.json
            build/security-monitor-receipt.json
            build/security-source-review.json
            build/security-preflight.json
            build/python-tooling-preflight.json
            build/python-tooling-inventory.json
          retention-days: 30
          if-no-files-found: error
