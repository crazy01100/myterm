name: MyTerm security monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: myterm-security-monitor
  cancel-in-progress: false
jobs:
  monitor:
    name: Risk monitoring (failure means an operational error)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: ./scripts/setup-security-tools.sh
      - name: Verify pinned Firebase development tools
        run: |
          npm ci --ignore-scripts --no-fund
          python3 scripts/patch-firebase-stream-json.py
          npm run test:development-tools
      - name: Verify release validation and audit policies
        run: ./scripts/security-python.sh -m unittest discover -s Tests/Security -v
      - name: Restore previous monitor state
        run: python3 scripts/restore-security-monitor.py build/previous-security-report.json
      - name: Scan source and released App
        run: |
          python3 scripts/security-audit.py --monitor \
            --include-release "$GITHUB_REPOSITORY" \
            --previous build/previous-security-report.json \
            --output build/security-report.json
      - name: Record risks in private Issues
        run: python3 scripts/sync-security-issues.py --report build/security-report.json --apply
      - name: Save monitor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-monitor-state
          path: |
            build/security-report.json
            build/security-issues-result.json
          retention-days: 30
          if-no-files-found: error
