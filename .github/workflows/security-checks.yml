name: MyTerm security monitor
on:
  workflow_dispatch:
    inputs:
      refresh_issue_format:
        description: Refresh existing bot Issue formatting while preserving history
        type: boolean
        default: false
  schedule:
    - cron: '23 1 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: myterm-security-monitor
  cancel-in-progress: false
jobs:
  monitor:
    name: Risk monitoring (failure means an operational error)
    if: github.repository == 'crazy01100/myterm' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select verification profile from exact source changes
        id: verification
        run: ./scripts/project-python.sh scripts/security-test-profile.py
      - name: Install pinned verification tools
        run: ./scripts/setup-security-tools.sh
      - name: Verify pinned Firebase development tools
        run: |
          mkdir -p build
          ./scripts/project-python.sh -c 'import json; print(json.dumps({"stage": "development-tool-preflight", "status": "started"}))' > build/security-preflight.json
          npm ci --ignore-scripts --no-fund
          ./scripts/project-python.sh scripts/security-conditional-risk.py --purpose monitor --task "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output build/security-conditional-review.json
          ./scripts/project-node.sh scripts/verify-firebase-tools.cjs
      - name: Verify development tool consumers (full profile only)
        if: steps.verification.outputs.profile == 'full'
        run: ./scripts/project-node.sh --npm run test:development-tools
      - name: Verify release validation and audit policies (full profile only)
        if: steps.verification.outputs.profile == 'full'
        run: ./scripts/security-python.sh -m unittest discover -s Tests/Security -v
      - name: Verify policy and entry fixtures (no vulnerability tests)
        if: steps.verification.outputs.profile == 'policy-only'
        run: ./scripts/security-python.sh scripts/run-policy-tests.py
      - name: Restore previous monitor state
        run: python3 scripts/restore-security-monitor.py build/previous-security-report.json
      - name: Scan source and released App
        run: |
          python3 scripts/security-audit.py --monitor \
            --include-release "$GITHUB_REPOSITORY" \
            --previous build/previous-security-report.json \
            --output build/security-report.json
      - name: Record published advisory risks in Issues
        env:
          REFRESH_ISSUE_FORMAT: ${{ inputs.refresh_issue_format }}
        run: |
          args=()
          if [[ "$REFRESH_ISSUE_FORMAT" == "true" ]]; then args+=(--refresh-format); fi
          python3 scripts/sync-security-issues.py --report build/security-report.json --allow-public --apply "${args[@]}"
      - name: Save monitor evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-monitor-state
          path: |
            build/security-report.json
            build/security-issues-result.json
            build/security-conditional-review.json
            build/security-preflight.json
          retention-days: 30
          if-no-files-found: error
