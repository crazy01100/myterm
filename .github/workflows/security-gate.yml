name: MyTerm release security gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    name: Release policy (unresolved risks block approval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MYTERM_CI_OPENSSL: required
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: Prepare verified OpenSSL for project Python
        run: '"$pythonLocation/bin/python3" -I -S -B scripts/project-openssl-runtime.py setup'
      - name: Select verification profile from exact source changes
        id: verification
        run: ./scripts/project-python.sh scripts/security-test-profile.py
      - name: Install pinned verification tools
        run: |
          mkdir -p build
          printf '%s\n' '{"stage":"python-bootstrap","status":"started"}' > build/python-tooling-preflight.json
          ./scripts/setup-security-tools.sh
          ./scripts/project-python.sh -I -B scripts/project-gh-runtime.py setup
          ./scripts/project-python.sh -B scripts/node-toolchain.py setup
          ./scripts/project-python.sh -B scripts/project-java-runtime.py setup
          ./scripts/project-python.sh -B scripts/security-prepare-inventory.py
          ./scripts/project-python.sh -B scripts/python-toolchain.py inventory > build/python-tooling-inventory.json
      - name: Verify pinned Firebase development tools
        run: |
          mkdir -p build
          ./scripts/project-python.sh -c 'import json; print(json.dumps({"stage": "development-tool-preflight", "status": "started"}))' > build/security-preflight.json
          ./scripts/project-node.sh --npm ci --ignore-scripts --no-fund --no-audit
          ./scripts/project-node.sh --npm ci --prefix Tools/Deployment --ignore-scripts --no-fund --no-audit --userconfig=/dev/null --registry=https://registry.npmjs.org
          ./scripts/project-python.sh scripts/security-source-review.py --purpose ci --task "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output build/security-source-review.json
          ./scripts/project-node.sh scripts/verify-firebase-tools.cjs
      - name: Verify development tool consumers (full profile only)
        if: steps.verification.outputs.profile == 'full'
        run: ./scripts/project-node.sh --npm run test:development-tools
      - name: Verify release validation and audit policies (full profile only)
        if: steps.verification.outputs.profile == 'full'
        run: ./scripts/security-python.sh -m unittest discover -s Tests/Security -v
      - name: Verify policy and entry fixtures (no vulnerability tests)
        if: steps.verification.outputs.profile == 'policy-only'
        run: ./scripts/security-python.sh scripts/run-policy-tests.py
      - name: Enforce existing merge scope and complete expanded monitoring
        run: ./scripts/project-python.sh scripts/security-audit.py --merge-gate --output build/security-report.json
      - name: Verify final policy-change approval
        if: always() && github.event_name == 'pull_request'
        run: ./scripts/project-python.sh scripts/security-source-review.py --ci-review
      - name: Save policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-check-report
          path: |
            build/security-report.json
            build/security-source-review.json
            build/security-preflight.json
            build/python-tooling-preflight.json
            build/python-tooling-inventory.json
          retention-days: 14
          if-no-files-found: error
