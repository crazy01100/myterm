<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MyTerm 是為 macOS 設計的 SSH、SFTP 與終端機管理工具。">
  <title>MyTerm</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">
        <span>&gt;_&lt;</span>
        <span class="cloud">☁</span>
      </div>
      <div>
        <p class="eyebrow">macOS · Apple Silicon</p>
        <h1>MyTerm</h1>
        <p class="lead">專注於順手、安全與本機優先的 SSH、SFTP 與終端機管理工具。</p>
      </div>
    </header>

    <section class="card status-card" aria-labelledby="release-title">
      <div>
        <p class="label">最新版本</p>
        <h2 id="release-title">尚未正式發布</h2>
        <p>正式版本發布後，可從 MyTerm 選單的「檢查更新…」安全下載並安裝。</p>
      </div>
      <a class="button" href="/install/">查看安裝說明</a>
    </section>

    <section class="grid" aria-label="MyTerm 特點">
      <article class="card">
        <h2>本機優先</h2>
        <p>不啟用同步也能使用；主機密碼安全保存在 macOS Keychain。</p>
      </article>
      <article class="card">
        <h2>安全更新</h2>
        <p>更新檔使用 Sparkle Ed25519 簽章驗證，遭修改的檔案會被拒絕。</p>
      </article>
      <article class="card">
        <h2>自選同步</h2>
        <p>可自行架設雲端服務，並使用端對端加密同步主機與密碼；服務使用範圍由自行架設者決定。</p>
      </article>
    </section>

    <nav class="footer-links" aria-label="相關資訊">
      <a href="/install/">安裝說明</a>
      <a href="/privacy/">隱私權</a>
      <a href="/security/">安全性</a>
      <a href="/appcast.xml">更新清單</a>
    </nav>
  </main>
</body>
</html>
