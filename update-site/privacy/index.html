<body>
  <main class="shell document">
    <a class="back-link" href="/">← 回到 MyTerm</a>
    <h1>更新站隱私權</h1>
    <section class="card">
      <p>本更新網站不使用廣告、分析程式、追蹤 Cookie、登入功能或表單。網站只提供 MyTerm 更新清單、版本說明與已簽署的安裝檔。</p>
      <h2>Cloudflare</h2>
      <p>網站透過 Cloudflare Pages 提供。Cloudflare 可能依其服務運作與安全需求處理一般網路連線資訊；本站不另外建立使用者追蹤資料。</p>
      <h2>App 資料</h2>
      <p>SSH 主機、群組、Keychain 密碼與同步內容不會傳送至本更新網站。MyTerm 的跨裝置同步是獨立且可選的功能。</p>
    </section>
  </main>
</body>
